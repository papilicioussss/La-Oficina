<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>La Oficina · Vacilando Ando</title>
    <meta name="description" content="Oficina virtual con agentes de IA para el contenido de Instagram y TikTok de Vacilando Ando Tours." />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/office.css" />
    <link rel="stylesheet" href="css/meeting.css" />
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#/" aria-label="Inicio de La Oficina">
        <img class="brand-logo" src="assets/logo-256.png" alt="Logo de Vacilando Ando" width="38" height="38" />
        <span class="brand-text">
          <strong>La Oficina</strong>
          <small>Vacilando Ando Tours</small>
        </span>
      </a>
      <nav class="topnav" aria-label="Accesos rápidos">
        <a class="btn btn-ghost btn-sm" href="#/favoritos" aria-label="Favoritos">
          <span aria-hidden="true">⭐</span>
          <span class="hide-sm">Favoritos</span>
        </a>
        <a class="btn btn-ghost btn-sm" href="#/fechas" aria-label="Fechas para vender">
          <span aria-hidden="true">📅</span>
          <span class="hide-sm">Fechas</span>
        </a>
        <a class="btn btn-ghost btn-sm" href="#/juntas" aria-label="Sala de juntas">
          <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
            <path d="M16 3.13a4 4 0 0 1 0 7.75" />
          </svg>
          <span class="hide-sm">Sala de juntas</span>
        </a>
        <a class="btn btn-ghost btn-sm" href="#/config" aria-label="Configuración">
          <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
          <span class="hide-sm">Configuración</span>
        </a>
      </nav>
    </header>

    <main class="layout">
      <section class="stage" aria-label="La oficina">
        <div id="office" class="office"></div>
        <p class="office-hint">👆 Toca un agente para ir a consultarle · toca el piso para caminar<span class="hide-sm"> · o muévete con las flechas / WASD</span></p>
        <nav id="dock" class="dock" aria-label="Ir a una oficina"></nav>
      </section>
      <aside id="panel" class="panel" aria-live="polite"></aside>
    </main>

    <div id="modal-root"></div>
    <div id="toast-root" class="toasts" aria-live="polite"></div>
    <noscript>Esta app necesita JavaScript activado.</noscript>
  </body>
</html>
